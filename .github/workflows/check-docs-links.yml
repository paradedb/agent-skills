# workflows/check-docs-links.yml
#
# Check Docs Links
# Alerts when a docs.paradedb.com page referenced by the skill moves or disappears. The
# skill sends agents to fetch those pages at runtime, so a rename here is silent until an
# agent 404s mid-answer. Issues are disabled on this repository, so failures go to Slack.

name: Check Docs Links

on:
  schedule:
    # 1 PM PST (21:00 UTC), Mondays. GitHub cron is UTC-only with no DST, so this
    # lands at 2 PM during PDT.
    - cron: "0 21 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.md"
      - "scripts/paradedb-docs"
      - ".github/workflows/check-docs-links.yml"
      - ".github/scripts/check-docs-links.sh"

concurrency:
  group: check-docs-links-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-docs-links:
    name: Check Docs Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Job level so the Slack step's `if` can test it; step level env isn't in scope there.
      WEBHOOK_URL: ${{ secrets.SLACK_GITHUB_CHANNEL_WEBHOOK_URL }}

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7

      - name: Check Documentation Links
        run: ./.github/scripts/check-docs-links.sh

      - name: Build Slack Failure Payload
        # Scheduled runs only. A PR that breaks a link fails its own check loudly.
        if: failure() && github.event_name == 'schedule'
        env:
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node > slack-payload.json <<'NODE'
          process.stdout.write(JSON.stringify({
            text: "🚨 ParadeDB agent skill points at a broken docs link",
            attachments: [{
              color: "danger",
              fields: [
                { title: "Repository", value: process.env.REPO, short: true },
                { title: "Details", value: "A docs.paradedb.com page referenced by the skill no longer resolves. Update the reference, or add a redirect in the docs.", short: false },
                { title: "View Logs", value: `<${process.env.RUN_URL}|Click here>`, short: false }
              ]
            }]
          }))
          NODE

      - name: Ping Slack On Failure
        if: failure() && github.event_name == 'schedule' && env.WEBHOOK_URL != ''
        uses: paradedb/actions/slack-alert@v10
        with:
          webhook_url: ${{ secrets.SLACK_GITHUB_CHANNEL_WEBHOOK_URL }}
          payload_file: slack-payload.json
